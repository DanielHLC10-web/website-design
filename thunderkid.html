<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SUPERHERO CARD</title>
    <style>
    body{
        background-color: darkblue;
        color: ghostwhite;
        font-family: fantasy;

    }
    .superhero{
        font-size: 50px;
        font-weight: bold;
        color: rgb(255, 255, 105);
        text-shadow: 5px 5px orangered;
        text-align: center;
    }
    .thunder{
        font-style: italic;
        color:rgb(255, 255, 105);
        text-transform: capitalize;
        text-align: center;
    }
    .attributes{
        text-transform: uppercase;
        text-decoration: underline;
        color: greenyellow;
        
    }
    .failure{
        text-transform: uppercase;
        text-decoration: underline;
        color: red;
    }
    .power{
    font-weight: bold;
    color: chartreuse;
    font-size: 20px;
    }
    .weaknesses{
        text-decoration: line-through;
        color: red;
        font-size: 20px;}

    .badge{
        font-size: 50px;
        text-align: center;
        font-weight: bolder;
        transform: rotate(10deg);
        color: rgb(255, 255, 105);
        text-shadow:5px 5px orangered;
    }
    .footer{
        font-style: italic;
        text-align: center;
        color: hotpink;
        font-size: 25px;
    }


    </style>
</head>

<body>
    <h1 class="superhero">Thunder Kid</h1>
    <p class="thunder">Greatest teenage superhero in the city!</p>

    <h2 class="attributes">His super strengths!</h2>
    <p class="power">He has X ray vision</p>
    <p class="power">He can generate electricity using his hands</p>

    <h2 class="failure">His weaknesses</h2>
    <p class="weaknesses"> Vegetables</p>
     <p class="weaknesses"> Wind</p>

     <p class="badge">TOP HERO</p>

     <p class="footer">Created by Dani</p>

</body>
</html>
