<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Restaurant</title>
    <style>
        body{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 20px;
            background-color:burlywood;
            text-align: center;
        }
        h1{
            color: firebrick;

        }
       ul>li{
        list-style: none;
        margin: 15px;
        background-color: honeydew;
        border: 5px solid ;
        padding: 5px;
        border-radius: 20px;
        width: 200px;
        
       }
       ul{
        margin-left:20%;
       }
       li:nth-child(1){
        color: chocolate;
        font-weight: bold;
       }
       a{
        text-decoration: none;
        color: chocolate;}
        a:hover{
            color: darkred;
            background-color: goldenrod;
        }
        .motto::first-letter{
            font-size: 50px;
            font-family: cursive;
            color: deeppink;
        }
    </style>
</head>
<body>
    <h1>My Food Menu</h1>
    <p>Pick your favourite dish</p>
    <ul>
        <li>Takoyaki- BEST</li>
        <li>Napoli Pizza</li>
        <li>Naruto ramen</li>
        <li>Burrito Bowl</li>
        <li>Nigiri</li>
    </ul>
    <p class="motto">Every dish is made with love and fresh ingredients</p>
    <a href="#">Our chefs</a><br>
    <a href="#">Our top tier ingredient suppliers</a>

</body>
</html>
