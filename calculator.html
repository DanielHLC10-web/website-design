<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Share Tech Mono', monospace;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: radial-gradient(circle at center, #001e3d 0%, #000913 100%);
}

/* Neon Glow Calculator Container */
.calculator {
  background: transparent;
  padding: 25px;
  border-radius: 30px;
  border: 3px solid #00f3ff;
  box-shadow: 0 0 10px #00f3ff,
              0 0 20px #00f3ff,
              inset 0 0 10px #00f3ff,
              inset 0 0 20px #00f3ff;
  width: 320px;
}

/* Glowing Screen */
#display {
  width: 100%;
  height: 65px;
  background: transparent;
  border: 2px solid #00f3ff;
  border-radius: 12px;
  font-size: 32px;
  color: #00f3ff;
  text-align: right;
  padding: 0 20px;
  margin-bottom: 22px;
  box-shadow: 0 0 8px #00f3ff, inset 0 0 8px #00f3ff;
  letter-spacing: 2px;
}

#display::placeholder {
  color: rgba(0, 243, 255, 0.4);
}

/* Button Grid Layout */
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

/* Neon Outline Buttons */
button {
  height: 50px;
  font-size: 20px;
  cursor: pointer;
  border-radius: 10px;
  border: 2px solid #00f3ff;
  background: transparent;
  color: #00f3ff;
  box-shadow: 0 0 5px #00f3ff, inset 0 0 5px #00f3ff;
  transition: all 0.15s ease-in-out;
}

/* Intense Glow on Hover */
button:hover {
  background: rgba(0, 243, 255, 0.15);
  box-shadow: 0 0 12px #00f3ff,
              0 0 25px #00f3ff,
              inset 0 0 12px #00f3ff;
}

button:active {
  background: rgba(0, 243, 255, 0.3);
  transform: scale(0.96);
}
.equal{
    grid-column: span 2;
}
       



    </style>
</head>
<body>
    <div class="calculator">
        <h2>Calculator</h2>
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button class="delete" onclick="deleteDisplay()">DEL</button>
            <button class="operator" onclick="put('%')">%</button>
            <button class="operator" onclick="put('/')">÷</button>
            <button class="number" onclick="put('7')">7</button>
            <button class="number" onclick="put('8')">8</button>
            <button class="number" onclick="put('9')">9</button>
            <button class="operator" onclick="put('*')">x</button>
            <button class="number" onclick="put('6')">6</button>
            <button class="number" onclick="put('5')">5</button>
            <button class="number" onclick="put('4')">4</button>
            <button class="operator" onclick="put('-')">-</button>
            <button class="number" onclick="put('3')">3</button>
            <button class="number" onclick="put('2')">2</button>
            <button class="number" onclick="put('1')">1</button>
            <button class="operator" onclick="put('+')">+</button>
            <button class="number" onclick="put('0')">0</button>
            <button class="dot" onclick="put('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div> 
    </div>

    <script>
        function put(value){
          
            let d=document.getElementById("display");
            if (d.value==="error"){
              d.value="";
            }
            d.value=d.value+value;
            

        }
        function clearDisplay(){
            document.getElementById("display").value="";
        };
        function deleteDisplay(){
            let d=document.getElementById("display");
            d.value=d.value.slice(0,-1)
        }
        function calculate(){
          let d=document.getElementById("display");
          try {
            if (d.value===""){
              return;
            }
            if (!/^[0-9+\-*/%.() ]+$/.test(d.value)){
              d.value="Error";
              return;
            }
            let result= Function("return ("+d.value+")")();
            if(!Number.isFinite(result)){
              d.value="error";
            }else{d.value=result;}




            }
            catch(error){
              d.value="error";

          }
        }


    </script>
    
</body>
</html>
