<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            background-color: #1e293b;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height:100vh;
            padding: 15px;

        }

        .calculator{
            background-color: cornflowerblue;
            padding: 20px;
            border: 4px solid cornsilk;
            border-radius: 10px;
            max-width:380px ;
            width: 100%;
            box-shadow: 0px 10px 25px ;

        }
        h2{
            color:aliceblue;
            text-align: center;
            margin-bottom: 20px;
            font-size: 40px;
        }
        #display{
            width: 100%;
            height: 70px;
            margin-bottom: 20px;
            padding: 15px;
            text-align: right;
            border: none;
            border-radius: 10px;
            color: cornflowerblue;
        }
        .buttons{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap:10px;
        }
        button{
            height: 60px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: black;
            
        }
        button:hover{
            background-color: azure;
            transform: scale(1.05);
        }
        button:active{
            transform: scale(0.95);
        }
        .operator{
            background-color: aquamarine;
        }
        .number{
            background-color: aqua;
        }
        .equal{
            grid-column: span 2;
            background-color: darkslateblue;
        }
        .clear{
            background-color: deepskyblue;
        }
        .delete{
            background-color: dodgerblue;
        }
        .dot{
            background-color: indigo;
        }



    </style>
</head>
<body>
    <div class="calculator">
        <h2>Calculator</h2>
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button class="delete" onclick="deleteDisplay()">DEL</button>
            <button class="operator" onclick="put('%')">%</button>
            <button class="operator" onclick="put('/')">÷</button>
            <button class="number" onclick="put('7')">7</button>
            <button class="number" onclick="put('8')">8</button>
            <button class="number" onclick="put('9')">9</button>
            <button class="operator" onclick="put('*')">x</button>
            <button class="number" onclick="put('6')">6</button>
            <button class="number" onclick="put('5')">5</button>
            <button class="number" onclick="put('4')">4</button>
            <button class="operator" onclick="put('-')">-</button>
            <button class="number" onclick="put('3')">3</button>
            <button class="number" onclick="put('2')">2</button>
            <button class="number" onclick="put('1')">1</button>
            <button class="operator" onclick="put('+')">+</button>
            <button class="number" onclick="put('0')">0</button>
            <button class="dot" onclick="put('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div> 
    </div>

    <script>
        function put(value){
            document.getElementById("display").value+=value;
        }
        function clearDisplay(){
            document.getElementById("clear").value="";
        };
        function deleteDisplay(){
            let d=getElementById("display");
            d.value=d.value.slice(0,-1)
        }
        

    </script>
    
</body>
</html>
