<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobbies Cards </title>
    <link rel="stylesheet"

href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<style>
    body{
        background-color: #f9f9f9;
        color: black;
        padding: 20px 35px;
        font-family: 'Times New Roman', Times, serif;

    }
.hobbie-card{
    border: 4px double;
    text-align: center;
    border-radius: 20px;
    margin-bottom: 20px;
    padding: 5px;
    background-color: bisque;
}
.hobbie-card h2{
    color: midnightblue;
}

</style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-lg-3">
            <div class="hobbie-card">
                <h2>Basketball</h2>
                <p>Basketball is a good hobby keep active and have fun</p>
            </div>
            </div>
            <div class="col-lg-3">
            <div class="hobbie-card">
                <h2>Tennis</h2>
                <p>Good for your coordination and reaction time</p>
                </div>
            </div>
           <div class="col-lg-3">
            <div class="hobbie-card">
                <h2>Drawing</h2>
                <p>Great way to express yourself to others</p>
            </div>
           </div>
           <div class="col-lg-3">
            <div class="hobbie-card">
                <h2>Drawing</h2>
                <p>Great way to express yourself to others</p>
            </div>
           </div>
        </div>
    </div>
    
    
</body>
</html>
