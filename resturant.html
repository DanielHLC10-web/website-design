<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #191919;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* --- Custom Chinese Pattern Navbar --- */
        .chinese-navbar {
            /* Traditional lattice pattern SVG encoded in CSS */
            background-color: #121212;
            background-image: radial-gradient(#d32f2f 0.75px, transparent 0.75px), radial-gradient(#d32f2f 0.75px, #121212 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            border-bottom: 2px solid #b71c1c;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .navbar-brand {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #ffc107 !important;
            letter-spacing: 1.5px;
        }

        .nav-link-custom {
            color: #e0e0e0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-decoration: none !important;
        }

        .nav-link-custom:hover {
            color: #ffc107;
            text-shadow: 0 0 8px rgba(255, 193, 7, 0.5);
        }

        /* --- Main Hero Section --- */
        .main-container {
            /* Height set to fill the screen minus the height of the navbar (~58px) */
            height: calc(100vh - 58px);
            padding: 0;
        }

        .image-box {
            position: relative;
            height: 100%;
            padding: 0;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65); /* Darkened slightly to make text pop */
        }

        /* Hero Text Content */
        .hero-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            width: 90%;
            max-width: 800px;
        }

        .hero-overlay h1 {
            color: #ffc107;
            font-family: "Anton", sans-serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            letter-spacing: 3px;
            margin-bottom: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .hero-overlay h2 {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            color: #f5f5f5;
            letter-spacing: 4px;
            margin-top: 5px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .hero-btn {
            margin-top: 25px;
            padding: 10px 28px;
            background-color: #b71c1c;
            color: #ffffff;
            border: 2px solid #ffc107;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .hero-btn:hover {
            background-color: #ffc107;
            color: #121212;
            border-color: #b71c1c;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.6);
        }
    </style>

    <title>Spice Temple</title>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark chinese-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <span style="color: #b71c1c;">&#129511;</span> SPICE TEMPLE
            </a>
            
            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ml-auto align-items-center">
                    <a class="nav-item nav-link nav-link-custom mx-2" href="#">Our Craft</a>
                    <a class="nav-item nav-link nav-link-custom mx-2" href="#">Locations</a>
                    <a class="nav-item nav-link nav-link-custom mx-2" href="#">Ingredients</a>
                    <a class="nav-item nav-link nav-link-custom mx-2" href="#">Best Sellers</a>
                    <a class="nav-item nav-link nav-link-custom mx-2" href="#">Contact</a>
                    <a class="btn hero-btn btn-sm ml-lg-3 py-2 px-3" href="#">Book Table</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Hero Banner -->
    <div class="container-fluid main-container">
        <div class="row no-gutters h-100">
            <div class="col-12 image-box">
                <img src="https://asianinspirations.com.au/wp-content/uploads/2020/09/Wok-Hei-FK-1200x800.jpg" alt="Wok Hei Cooking">
                
                <div class="hero-overlay">
                    <h1>WELCOME</h1>
                    <h2>TO SPICE TEMPLE</h2>
                    <a href="#" class="btn hero-btn">Explore Menu</a>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
