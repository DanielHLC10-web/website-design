<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  background-color: #87ceeb;
  background-image: radial-gradient(circle, rgb(241, 241, 119) 2px, transparent 4px);
  background-size: 40px 40px;
  background-repeat: repeat;
  background-position: top center;
  
}



.weather-card{
    width: 400px;
    text-align:center;
    border: 3px solid white;
    border-radius: 20px;
   background-image:linear-gradient(to bottom right,#19e0ff,#87cefa);
   color: antiquewhite;
}

.cloud-id{
  font-size: 70px;
  animation: floatCloud 1s infinite alternate;
}
 
@keyframes floatCloud {
  from {
    transform: translateY(0);
  }
 
  to {
    transform: translateY(20px);
  }
}

.details{
    font-size:  30px;
}
#temperature{
    color: darkkhaki;
    font-size: 30px;
}
    </style>
</head>
<body>
    <h1>Weather app homepage</h1>
    

<div class="weather-card"> 
    <h2>Todays Weather</h2>
    <div class="cloud-id">Cloudy</div>
    
<p id="temperature">30°C</p>
<p class="details">City: Melbourne</p>
<p class="details">Condition: Partly Cloudy</p>
<p class="details">Humidity: 20%</p>
<p class="details">Rain percent chance:10%</p>
</div>

<h2>Weekly Forecast</h2>

<div class="forecast-section">
<h3 class="forecast-title">Next 5 Days</h3>

<p class="day">Monday: Sunny - 31°C</p>
<p class="day">Tuesday: Sunny - 35C</p>
<p class="day">Wednesday: Rainy - 15°C</p>
<p class="day">Thursday: Windy - 19°C</p>
<p class="day">Friday: Sunny- 24°C</p>
</div>
    
</body>
</html>
