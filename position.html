<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pet Page</title>
    <style>
        body{
            font-family: 'Times New Roman', Times, serif;
            background-color: chocolate;
            padding:30px;
        }
        .fixed{position: fixed;
         background-color: beige;
         padding: 10px;
         top: 0;
        }
        .relative{
            position: relative;
            left: 40px;
            background-color: blanchedalmond;
            padding: 20px;
            width: 200px;
        }
        .card{
            position: relative;
            background-color: bisque;
            padding: 20px;
            border: 5px double  ;

        }
        .absolute{
            position:absolute;
            right: 10px;
            background-color: cornflowerblue;

        }
        .sticky{
            position: sticky;
            top: 200px;
            background-color: cornsilk;

        }

    </style>
</head>
<body>
    <div class="fixed">Fixed : Buddy</div>
    <h1>My Pet Page</h1>
    <h2>Static</h2>
    <p>Buddy is a sausage dog</p>
    <h2>Relative</h2>
    <div class="relative">Relative: Pet of the month!</div>
    <h2>Absolute</h2>
    <div class="card">Species : Sausage dog
        <span class="absolute">Adopted</span>
    </div>
    <h2>Sticky</h2>
    <div class="sticky">Sticky : More pets</div>
